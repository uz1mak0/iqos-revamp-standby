type Mutation {
  bannerAdd(inputs: [BannerInput!]!, type: BannerType!): Banners
    @aws_cognito_user_pools
  bannerRemove(id: ID!, type: BannerType!): Banners @aws_cognito_user_pools
  featureUpdate(is_active: Boolean!, type: FeatureType!): Feature
    @aws_cognito_user_pools
  lendingPrimaryBannerUpdate(
    filename: String
    image: AWSURL
    landing_message: String
    reroute: String
    warning_message: String
  ): Banner @aws_cognito_user_pools
  lendingSettingsUpdate(input: LendingSettingsInput): LendingSettings
  orderCancel(order_id: ID!, payment_id: ID!, total_amount: Float!): String
    @aws_cognito_user_pools
  orderCreate(input: OrderInput!): Order @aws_cognito_user_pools @aws_iam
  orderUpdate(ecom_order: ID, order_id: ID!, status: LeadStatus!): Order
    @aws_cognito_user_pools
    @aws_iam
  promoCreate(input: PromoInput!): Promo @aws_cognito_user_pools
  promoRemove(code: ID!): Promo @aws_cognito_user_pools
  promoUpdate(code: ID!, input: PromoUpdateInput!): Promo
    @aws_cognito_user_pools
  register(input: RegistrationInput!): Registration
    @aws_cognito_user_pools
    @aws_iam
  registrationUpdate(
    customer_id: ID!
    status: RegistrationStatus!
    type: RegistrationType!
  ): Registration @aws_cognito_user_pools @aws_iam
  settingsUpdate(input: SettingsInput!): Settings
  skuCategoryUpdate(inputs: [SKUCategoryInput!]!): SKUCategories
    @aws_cognito_user_pools
  skuCreate(input: SKUInput!): SKU @aws_cognito_user_pools
  skuRemove(sku: ID!): SKU @aws_cognito_user_pools
  skuUpdate(input: SKUUpdateInput!, sku: ID!): SKU @aws_cognito_user_pools
  userCreate(input: UserInput!): User @aws_cognito_user_pools
  userDisable(id: ID!): User @aws_cognito_user_pools
  userEnable(id: ID!): User @aws_cognito_user_pools
  userUpdate(id: ID!, input: UserUpdateInput!): User @aws_cognito_user_pools
  variantCreate(base_sku: ID!, input: SKUInput!): SKU @aws_cognito_user_pools
}

type Order @aws_cognito_user_pools @aws_iam {
  address: Address
  cart: Cart
  channel: OrderChannel
  date_created: AWSTimestamp
  dce_id: ID
  discount: Float
  ecom_order: ID
  id: ID
  name: String
  payment_id: ID
  promo_code: ID
  source: String
  status: LeadStatus
  tickers: Tickers
  total_amount: Float
  tracking: EComOrder
}

type OrderConnection @aws_cognito_user_pools @aws_iam {
  items: [Order]
  nextToken: String
}

type Promo @aws_cognito_user_pools {
  block_with_device: Boolean
  block_with_heets: Boolean
  code: ID!
  code_redemptions: Int
  discount: Float!
  is_enabled: Boolean
  max_code_redemptions: Int
  max_redemptions_per_customer: Int
  target_sku: [ID]
  valid_from: AWSTimestamp
  valid_to: AWSTimestamp
}

type PromoConnection @aws_cognito_user_pools {
  items: [Promo]
  nextToken: String
}

type Query {
  banners(type: BannerType!): [Banner] @aws_cognito_user_pools
  customer_orders(customer_id: ID!): OrderConnection
    @aws_cognito_user_pools
    @aws_iam
  feature(type: FeatureType!): Feature @aws_cognito_user_pools
  lending_traffic(from: AWSDate, to: AWSDate): [LendingTraffic]
    @aws_cognito_user_pools
  order(id: ID!): Order @aws_cognito_user_pools
  orders(from: AWSTimestamp, to: AWSTimestamp): OrderConnection
    @aws_cognito_user_pools
    @aws_iam
  promos: PromoConnection @aws_cognito_user_pools
  registrations(
    filter: DateFilter
    next_token: String
    type: RegistrationType
  ): RegistrationConnection @aws_cognito_user_pools
  report(filter: FilterInput, type: ReportType): AWSURL @aws_cognito_user_pools
  settings: Settings
  sku(sku: ID!): SKU @aws_cognito_user_pools
  skuCategories: SKUCategories @aws_cognito_user_pools
  skus: [SKU] @aws_cognito_user_pools
  traffic(from: AWSDate, to: AWSDate): [Traffic] @aws_cognito_user_pools
  user(id: ID!): User @aws_cognito_user_pools
  users(next_token: String): UserConnection @aws_cognito_user_pools
  variants(base_sku: ID!): [SKU] @aws_cognito_user_pools
}

