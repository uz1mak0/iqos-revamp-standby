type Subscription {
  onOrderCreated: Order
    @aws_cognito_user_pools
    @aws_subscribe(mutations: ["orderCreate"])
  onRegistration: Registration
    @aws_cognito_user_pools
    @aws_subscribe(mutations: ["register"])
  onRegistrationUpdate: Registration
    @aws_cognito_user_pools
    @aws_subscribe(mutations: ["registrationUpdate"])
}

