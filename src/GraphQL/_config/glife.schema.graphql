  discount: Float
  quantity: Int
  sku: ID
}

type Customer @aws_cognito_user_pools @aws_iam {
  addresses: [Address]
  first_name: String
  id: ID
  is_permission_enabled: Boolean
  last_name: String
  name: String
}

type DeliveryLog @aws_cognito_user_pools @aws_iam {
  status: String
